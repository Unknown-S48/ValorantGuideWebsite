<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Valorant Maxxing — an Immortal 3 field manual of Valorant core game logic: improvement, agents, aim prep, mentality, gunplay, economy, movement, round flow, utility, comms and rank progression." />
<meta name="theme-color" content="#120c09" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 26 16 30 2 26Z' fill='%23ff6a2b'/%3E%3C/svg%3E" />
<title>Valorant Maxxing — Immortal 3 Field Manual</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ================= TOP BAR ================= -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="immortal-badge" aria-hidden="true"></span>
    VALORANT <span>/ Immortal 3</span>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <input id="search" type="search" placeholder="Search notes… ( / )" autocomplete="off" spellcheck="false" aria-label="Search notes" />
    <span class="search-count" id="searchCount"></span>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="randomTip" title="Random tip" aria-label="Show a random tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle colour theme">
      <span id="themeIcon">🌙</span>
    </button>
    <button class="icon-btn" id="printBtn" title="Print / Save as PDF" aria-label="Print page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/>
        <path d="M6 14h12v7H6z"/>
      </svg>
    </button>
  </div>

  <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="app">

  <!-- ---------- SIDEWAYS TAB STRIP ---------- -->
  <div class="tabstrip" id="tabs" role="tablist" aria-label="Topics">
    <div class="strip-brand" id="brand">Valorant</div>
    <div class="strip-brand-sub" id="brandSub">Immortal 3 · Field Manual</div>
  </div>

  <!-- ---------- PANEL AREA ---------- -->
  <main>

    <header class="page-head">
      <h1 id="pageHeading">Valorant Maxxing<em>.</em></h1>
      <p id="pageIntro"></p>
      <div class="stats" id="stats"></div>
    </header>

    <!-- Panels are rendered by js/main.js from data/content.json -->
    <div id="content"></div>

    <footer>
      <p id="footerText"></p>
      <p class="kbd-hints">Press <kbd>/</kbd> to search · <kbd>Esc</kbd> to clear · <kbd>T</kbd> random tip · <kbd>←</kbd> <kbd>→</kbd> switch panels</p>
    </footer>

  </main>
</div>

<!-- ================= FLOATING UI ================= -->
<button class="fab" id="backToTop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 14 12 8 18 14"/>
  </svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>

</body>
</html>
